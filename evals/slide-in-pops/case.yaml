# One eval case per trap it names; see evals/README.md.
schema_version: "1.1"
name: slide-in-pops
description: Should lead to slide-transition-defaults-to-half-a-height in compose-visuals-footguns.
tags: [compose, trap]
execution:
  prompt: |
    In Jetpack Compose our bottom bar uses
    AnimatedVisibility(visible, enter = slideInVertically() + fadeIn(), exit = slideOutVertically() + fadeOut()).
    It does not look like it slides; it seems to pop into place. Why, and how should I write the transition?
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 3
graders:
  - type: llm
    name: names-the-mechanism-and-fix
    criteria: |
      Pass only if the response does BOTH:
      1. States that with no offset argument the slide covers only half of the element's height
         (the default offset is half the height), so the element starts already halfway and the
         motion reads as a pop. The exact lambda or its sign need not be quoted.
      2. Recommends passing the full height as the offset, with the sign for the edge the bar enters from
         (for a bottom bar, initialOffsetY = { it } / targetOffsetY = { it }).
  - type: tool_used
    name: plugin-fired
    tool: Skill
    input_match: compose-visuals-footguns
    arm: with-only
  - type: tool_used
    name: opened-the-trap
    tool: Read
    input_match: slide-transition-defaults-to-half-a-height
    arm: with-only
